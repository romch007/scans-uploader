[package]
name = "scans-uploader"
version = "0.1.0"
edition = "2021"
authors = ["Romain Chardiny <romain.chardiny@gmail.com>"]
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
notify = "8.2.0"
pathdiff = "0.2.3"
reqwest = { version = "0.13.4", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
